[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "gpybyte"
version = "0.1.0"
description = "GPYByte - библиотека для работы с единицами памяти (поддержка стандарта JPYByte: IPY/HPY/GPY/JPY)"
readme = "README.md"
authors = [
    {name = "GPYByte Team"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["memory", "units", "gpybyte", "jpybyte", "converter", "bytes", "gis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/yourusername/gpybyte"
Repository = "https://github.com/yourusername/gpybyte"

[project.scripts]
gpybyte = "gpybyte.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpybyte"]

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "byteutils"
version = "0.1.0"
description = "Универсальная библиотека для работы с единицами измерения памяти"
readme = "README.md"
authors = [
    {name = "Ваше Имя", email = "your.email@example.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["memory", "units", "converter", "bytes", "kilobytes", "megabytes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/byteutils"
Repository = "https://github.com/yourusername/byteutils"

[project.scripts]
byteutils = "byteutils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/byteutils"]
